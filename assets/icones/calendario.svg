<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
    <style>
        .calendario-premium{
            stroke:#000000;
            stroke-width:1.8;
            stroke-linecap:round;
            stroke-linejoin:round;
            transform-origin:center;
            animation:piscar-calendario 2.4s ease-in-out infinite;
            transition:.30s ease;
        }

        svg:hover .calendario-premium{
            transform:translateY(-1px) rotate(-4deg);
            animation:none;
        }

        @keyframes piscar-calendario{
            0%,100%{
                opacity:1;
            }

            50%{
                opacity:.45;
            }
        }
    </style>

    <g class="calendario-premium">
        <rect x="3.5" y="4.5" width="17" height="16" rx="3.2"/>
        <path d="M7.5 2.8v4"/>
        <path d="M16.5 2.8v4"/>
        <path d="M3.5 9.3h17"/>
        <path d="M8 13.2h.01"/>
        <path d="M12 13.2h.01"/>
        <path d="M16 13.2h.01"/>
        <path d="M8 16.7h.01"/>
        <path d="M12 16.7h.01"/>
        <path d="M15.6 16.3l1.1 1.1l2.1-2.4"/>
    </g>
</svg>